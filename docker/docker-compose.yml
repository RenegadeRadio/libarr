# Libarr: API + SPA in one container, background jobs in a worker container.
# The single ./data:/data volume keeps the database, downloads and library on
# the same filesystem so imports hardlink instead of copy (the *Arr hardlink
# law). Set PUID/PGID to your host user ids so /data files are yours.
services:
  libarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: libarr:latest
    container_name: libarr
    ports:
      - "8787:8787"
    environment:
      - PUID=1000
      - PGID=1000
      # Direct private/loopback clients use the first admin account without a login wall.
      # Disable this if the app is placed behind a reverse proxy.
      - LIBARR_LAN_AUTH_BYPASS=true
      # OpenRouter-backed intent extraction for the Book Assistant. The API key
      # is supplied through docker/.env and is never committed.
      - LIBARR_CHAT_API_KEY=${OLLAMA_API_KEY:-}
      - LIBARR_CHAT_BASE_URL=https://openrouter.ai/api/v1
      - LIBARR_CHAT_MODEL=stealth/ox-alpha
      - LIBARR_GOODREADS_RATINGS_ENABLED=true
      # Uncomment to harden:
      # - LIBARR_SECRET_KEY=change-me
      # - LIBARR_APPRISE_URLS=tgram://bot:chatid
      # - LIBARR_SCHEDULER_ENABLED=false   # if the worker service handles jobs
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Background jobs process (Phase 4 modular split): RSS sync, download watch,
  # discovery lists, conversions. Shares the same /data volume.
  worker:
    image: libarr:latest
    container_name: libarr-worker
    command: ["libarr", "worker", "--interval", "300"]
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/data
    depends_on:
      libarr:
        condition: service_healthy
    restart: unless-stopped

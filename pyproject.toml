[project]
name = "libarr"
version = "0.1.0"
description = "Self-hosted *Arr-style eBook automation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Libarr Contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ebooklib>=0.19",
    "feedparser>=6.0",
    "aiohttp>=3.10",
    "arq>=0.26",
    "apscheduler>=3.10",
    "apprise>=1.9",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.3.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
libarr = "libarr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libarr"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
